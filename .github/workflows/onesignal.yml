name: Invia Allerte Zona (Bollettino)

# Prima questo workflow mandava un'unica notifica generica "nuovo
# bollettino disponibile" a tutti gli iscritti ad ogni modifica del
# file. Ora legge il bollettino, individua le zone davvero in allerta
# (oggi o domani diverso da verde) e notifica solo i cittadini iscritti
# ai comuni di quelle zone, con il livello e il rischio reali. Non
# rimanda la stessa notifica se lo stato della zona non e' cambiato
# dall'ultima volta (vedi scripts/invia_allerte_zona.js).

on:
  push:
    branches:
      - main # Cambia in "master" se il ramo principale del repo si chiama cosi'
    paths:
      - 'dati_bollettino.json' # Parte solo se questo file viene aggiornato
  workflow_dispatch: # Permette di avviarlo manualmente dal pannello Actions

permissions:
  contents: write # Serve per ricommittare lo stato delle zone dopo l'invio

jobs:
  invia-allerte:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Invia notifiche push mirate per zona
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          BOLLETTINO_PATH: ${{ github.workspace }}/dati_bollettino.json
          STATE_PATH: ${{ github.workspace }}/automazioni_state/ultimo_stato_zone.json
        run: node scripts/invia_allerte_zona.js

      - name: Salva lo stato delle zone notificate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add automazioni_state/ultimo_stato_zone.json
          git diff --staged --quiet || git commit -m "Aggiorna stato zone notificate [skip ci]"
          git push
